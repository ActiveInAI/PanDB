[package]
name = "dbx-formats"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
chrono = { version = "0.4.45", features = ["serde"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
[dev-dependencies]
uuid = { version = "1.29.0", features = ["v4"] }
calamine = { version = "0.37.0", features = ["dates"] }
tempfile = "3.27.0"