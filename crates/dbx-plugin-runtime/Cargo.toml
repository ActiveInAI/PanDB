[package]
name = "dbx-plugin-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
test-support = []

[dependencies]
dbx-platform = { path = "../dbx-platform", features = ["host-prompts", "downloads"] }
dbx-types = { path = "../dbx-types", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
semver = "1.0.28"
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
log = "0.4.34"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "json", "stream", "rustls", "socks"] }
futures = "0.3.34"
base64 = "0.23.1"
sha2 = "0.11.1"
bytes = "1.12.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
[dev-dependencies]
dbx-platform = { path = "../dbx-platform", features = ["test-support"] }
tokio = { version = "1.54.1", features = ["test-util", "rt-multi-thread"] }