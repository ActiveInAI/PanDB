[package]
name = "dbx-driver-sqlserver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# TDS ATTENTION (tiberius Client::send_attention) exists only in the vendored
# tiberius that the root workspace patches in (vendor/tiberius). Standalone
# agent driver workspaces resolve tiberius from crates.io and must keep this
# off; SqlServerClient::send_attention then degrades to a no-op.
native-attention = []

[dependencies]
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-sql-data = { path = "../dbx-sql-data" }
dbx-types = { path = "../dbx-types", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
tiberius = { version = "=0.12.3", default-features = false, features = ["tds73", "chrono", "rust_decimal", "vendored-openssl", "sql-browser-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4", "serde"] }