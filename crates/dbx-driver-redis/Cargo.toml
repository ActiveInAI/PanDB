[package]
name = "dbx-driver-redis"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
test-support = []

[dependencies]
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-types = { path = "../dbx-types", default-features = false }
base64 = "0.23.1"
redis = { version = "1.8.0", features = ["tokio-comp", "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp", "sentinel", "cluster-async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
[dev-dependencies]
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }