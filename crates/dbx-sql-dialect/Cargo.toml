[package]
name = "dbx-sql-dialect"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
dbx-types = { path = "../dbx-types", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
notify = { version = "8.2.1", default-features = false, features = ["macos_kqueue"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["sync"] }
[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "glob"] }
tempfile = "3.27.0"