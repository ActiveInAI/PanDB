[package]
name = "dbx-driver-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
test-support = []

[dependencies]
dbx-platform = { path = "../dbx-platform", features = ["host-prompts", "downloads"] }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-types = { path = "../dbx-types", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
crc = "3.4.0"
flate2 = "1.1.10"
futures = "0.3.34"
log = "0.4.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "cookies", "json", "stream", "rustls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
zstd = "0.14.3"
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.40.0", features = ["system"] }