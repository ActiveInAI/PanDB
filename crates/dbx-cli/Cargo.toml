[package]
name = "dbx-cli"
version = "0.4.135"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
dbx-core = { path = "../dbx-core", default-features = false, features = ["sqlite-bundled"] }
dbx-mcp = { path = "../dbx-mcp" }
dirs = "7.0.0"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
[dev-dependencies]
async-trait = "0.1.92"