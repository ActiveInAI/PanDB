[package]
name = "dbx-drivers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
duckdb-sidecar = []
dynamodb = ["dep:aws-sdk-dynamodb"]
mq-admin = ["dbx-types/mq-admin"]
# Desktop/native SQL Server batch interruption; see dbx-driver-sqlserver.
sqlserver-native-attention = ["dbx-driver-sqlserver/native-attention"]
sqlite-bundled = ["rusqlite/bundled"]
sqlite-sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
sqlite-multiple-ciphers = ["dep:libsqlite3-hotbundle"]
test-support = ["dbx-driver-agent/test-support", "dbx-driver-mysql/test-support", "dbx-driver-redis/test-support", "dbx-driver-support/test-support", "dbx-platform/test-support"]

[dependencies]
dbx-driver-agent = { path = "../dbx-driver-agent" }
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-driver-elasticsearch = { path = "../dbx-driver-elasticsearch" }
dbx-driver-mongodb = { path = "../dbx-driver-mongodb" }
dbx-driver-mysql = { path = "../dbx-driver-mysql" }
dbx-driver-postgres = { path = "../dbx-driver-postgres" }
dbx-driver-redis = { path = "../dbx-driver-redis" }
dbx-driver-sqlserver = { path = "../dbx-driver-sqlserver" }
dbx-types = { path = "../dbx-types", default-features = false }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-sql-data = { path = "../dbx-sql-data" }
dbx-sql-dialect = { path = "../dbx-sql-dialect" }
dbx-platform = { path = "../dbx-platform", features = ["host-prompts", "downloads"] }
dbx-sqlite-worker = { path = "../dbx-sqlite-worker", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
json5 = "1.3.6"
regex = "1.13.1"
percent-encoding = "2.3.2"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat", "rt"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
tokio-postgres-rustls = "0.14.0"
postgres-openssl = "0.5.3"
openssl = { version = "0.10.81", features = ["vendored"] }
webpki-roots = "1.0.11"
rusqlite = { version = "0.41.1", default-features = false, features = ["load_extension", "backup", "functions", "column_decltype"] }
libsqlite3-hotbundle = { path = "../../vendor/libsqlite3-hotbundle", features = ["cipher-sqlcipher"], optional = true }
mysql_async = { version = "=0.37.0", default-features = false, features = ["default-rustls", "client_ed25519", "chrono", "rust_decimal"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
tiberius = { version = "=0.12.3", default-features = false, features = ["tds73", "chrono", "rust_decimal", "vendored-openssl", "sql-browser-tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "cookies", "json", "stream", "rustls", "socks"] }
futures = "0.3.34"
aws-sdk-dynamodb = { version = "1.135.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
russh = "0.65.0"
pageant = "=0.2.1"
portpicker = "0.1.1"
csv = "1.4.0"
base64 = "0.23.1"
sha2 = "0.11.1"
bytes = "1.12.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
crc = "3.4.0"
tar = "0.4.46"
zstd = "0.14.3"
tempfile = "3.27.0"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }
[dev-dependencies]
axum = "0.8.9"
dbx-driver-support = { path = "../dbx-driver-support", features = ["test-support"] }
dbx-platform = { path = "../dbx-platform", features = ["test-support"] }
mysql_common = { git = "https://github.com/t8y2/rust_mysql_common.git", rev = "47740d85a8277167a5717afac785d37b46a36296", default-features = false }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-openssl = "0.6.5"
[target.'cfg(all(unix, not(target_os = "redox")))'.dev-dependencies]
nix = { version = "0.31.3", features = ["user"] }