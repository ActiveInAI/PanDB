[package]
name = "dbx-driver-support"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
test-support = ["dbx-platform/test-support"]

[dependencies]
dbx-platform = { path = "../dbx-platform" }
dbx-types = { path = "../dbx-types", default-features = false }
bytes = "1.12.1"
base64 = "0.23.1"
glob = "0.3.4"
log = "0.4.34"
portpicker = "0.1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "rustls", "charset", "socks"] }
russh = "0.65.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
uuid = { version = "1.29.0", features = ["v4"] }
[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }