[package]
name = "dbx-ai-provider"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
dbx-platform = { path = "../dbx-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "json", "stream", "rustls", "socks"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4.34"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
base64 = "0.23.1"
bytes = "1.12.1"
httpdate = "1.0.3"
tempfile = "3.27.0"
[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "system-proxy"] }
tokio = { version = "1.54.1", features = ["test-util", "rt-multi-thread"] }