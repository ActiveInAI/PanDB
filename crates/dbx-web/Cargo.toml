[package]
name = "dbx-web"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dbx-web"
path = "src/main.rs"

[features]
default = ["duckdb-sidecar", "dynamodb", "mq-admin", "sqlite-sqlcipher", "system-fonts"]
duckdb-sidecar = ["dbx-core/duckdb-sidecar", "dbx-mcp/duckdb-sidecar"]
dynamodb = ["dbx-core/dynamodb"]
mq-admin = ["dbx-core/mq-admin", "dbx-mcp/mq-admin"]
sqlite-sqlcipher = ["dbx-core/sqlite-sqlcipher"]
system-fonts = ["dbx-core/system-fonts"]
# Pass-through so CI feature lanes can compile-check the vendored ATTENTION
# path; the web server never executes manual transactions, so it stays off by
# default here.
sqlserver-native-attention = ["dbx-core/sqlserver-native-attention"]
# Embed the frontend build output (../../dist) into the binary. When enabled
# and DBX_STATIC_DIR is not set, the embedded files are served by default.
# Requires the frontend to have been built before invoking cargo.
embed-static = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
dbx-core = { path = "../dbx-core", default-features = false, features = ["openapi"] }
dbx-mcp = { path = "../dbx-mcp", default-features = false }
redis = { version = "1.8.0", features = ["tokio-comp"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "compression-gzip", "trace"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
uuid = { version = "1.29.0", features = ["v4"] }
argon2 = "0.6.0"
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
tracing = "0.1.44"
async-stream = "0.3.6"
futures = "0.3.34"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "json", "stream", "rustls"] }
chrono = "0.4.45"
aes-gcm = "0.11.1"
base64 = "0.23.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
rust-embed = { version = "8.13.0", features = ["debug-embed"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
[dev-dependencies]
dbx-core = { path = "../dbx-core", default-features = false, features = ["test-support"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "form", "multipart"] }