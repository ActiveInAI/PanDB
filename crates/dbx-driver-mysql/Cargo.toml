[package]
name = "dbx-driver-mysql"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
test-support = []

[dependencies]
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-sql-dialect = { path = "../dbx-sql-dialect" }
dbx-types = { path = "../dbx-types", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
encoding_rs = "0.8.42"
log = "0.4.34"
mysql_async = { version = "=0.37.0", default-features = false, features = ["default-rustls", "client_ed25519", "chrono", "rust_decimal"] }
percent-encoding = "2.3.2"
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
[dev-dependencies]
mysql_common = { git = "https://github.com/t8y2/rust_mysql_common.git", rev = "47740d85a8277167a5717afac785d37b46a36296", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }