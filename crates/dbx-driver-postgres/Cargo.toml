[package]
name = "dbx-driver-postgres"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-types = { path = "../dbx-types", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
bytes = "1.12.1"
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
encoding_rs = "0.8.42"
futures = "0.3.34"
log = "0.4.34"
openssl = { version = "0.10.81", features = ["vendored"] }
percent-encoding = "2.3.2"
postgres-openssl = "0.5.3"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webpki-roots = "1.0.11"
[dev-dependencies]
tempfile = "3.27.0"
tokio-openssl = "0.6.5"