[package]
name = "dbx"
version = "1.0.0"
description = "PanDB database management platform"
authors = ["skyler"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.99.0"

[lib]
name = "dbx_lib"
crate-type = ["rlib"]

[features]
default = ["duckdb-sidecar", "dynamodb", "mq-admin", "sqlite-multiple-ciphers", "system-fonts", "os-keyring", "sqlserver-native-attention"]
custom-protocol = ["tauri/custom-protocol"]
duckdb-sidecar = ["dbx-core/duckdb-sidecar"]
os-keyring = ["dbx-core/os-keyring"]
sqlserver-native-attention = ["dbx-core/sqlserver-native-attention"]
dynamodb = ["dbx-core/dynamodb"]
mq-admin = ["dbx-core/mq-admin"]
sqlite-sqlcipher = ["dbx-core/sqlite-sqlcipher"]
sqlite-multiple-ciphers = ["dbx-core/sqlite-multiple-ciphers"]
sqlite-bundled = ["dbx-core/sqlite-bundled"]
system-fonts = ["dbx-core/system-fonts"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
serde_yaml_ng = "0.10.0"
base64 = "0.23.1"
log = "0.4.34"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
rust_decimal = { version = "1.43.0", features = ["serde", "db-postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = { version = "2.8.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-shell = "2.6.0"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "2.5.0"
redis = { version = "1.8.0", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp", "cluster-async"] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
portpicker = "0.1.1"
tiberius = { version = "=0.12.3", default-features = false, features = ["tds73", "chrono", "rust_decimal", "vendored-openssl", "sql-browser-tokio"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
reqwest = { version = "0.13.5", features = ["query", "form", "json", "stream"] }
regex = "1.13.1"
grep = "0.4.1"
ignore = "0.4.34"
futures = "0.3.34"
mongodb = { version = "3.9.1", features = ["socks5-proxy"] }
percent-encoding = "2.3.2"
minisign-verify = "0.3.0"
semver = "1.0.28"
sha2 = "0.11.1"
russh = "0.65.0"
csv = "1.4.0"
calamine = "0.37.0"
zip = "9.1.3"
dbx-core = { path = "../crates/dbx-core", default-features = false }
dbx-platform = { path = "../crates/dbx-platform", default-features = false }
dbx-mcp = { path = "../crates/dbx-mcp", default-features = false, features = ["duckdb-sidecar", "mq-admin"] }
dbx-tauri-consul = { path = "../crates/dbx-tauri-consul" }
dbx-tauri-schema = { path = "../crates/dbx-tauri-schema" }
wry = { path = "../vendor/wry" }
axum = { version = "0.8.9", features = ["ws"] }
font-kit = "0.14.3"
tauri-plugin-clipboard-manager = "2.5.0"
sys-locale = "0.3.2"
sysinfo = { version = "0.40.0", features = ["system"] }
[dev-dependencies]
dbx-core = { path = "../crates/dbx-core", default-features = false, features = ["test-support"] }
tauri = { version = "2.12.5", features = ["test"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSDockTile", "NSEvent", "NSImage", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSBundle", "NSData", "NSString"] }
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"
gtk = "0.18.2"
libc = "0.2.191"
[target.'cfg(target_os = "windows")'.dependencies]
# 与 vendored wry / tauri-runtime-wry 同版本（Cargo.lock 只有一份 0.38.x），用于在
# 快捷键录入态运行时切换 WebView2 的浏览器加速键开关（见 commands/shortcut_recording.rs），
# 以及启动兼容模式下直接探测 WebView2 环境能否创建（见 webview2_preflight.rs）。
webview2-com = "0.39.1"
# `windows` crate 与 wry/webview2-com 使用同一份 0.61，仅用其 core 类型
# （HSTRING/PCWSTR/PWSTR/Interface），供 WebView2 预检调用 COM 接口时构造参数。
windows = { version = "0.62.2", default-features = false }
# `cast`（Settings → Settings3 的 QueryInterface）来自 windows-core 的 Interface trait，
# 版本与 vendored wry / webview2-com-sys 一致。
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }