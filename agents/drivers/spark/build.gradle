dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.apache.hive:hive-jdbc:4.2.1:standalone'
    implementation 'org.slf4j:slf4j-nop:2.0.20'
}

tasks.named('shadowJar') {
    manifest {
        attributes('Agent-Label': 'Apache Spark', 'Main-Class': 'com.dbx.agent.spark.SparkAgent')
    }
}
