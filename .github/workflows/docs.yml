name: Deploy Docs

on:
  # Automatic DBX Cloudflare deployment is disabled until PanDB has its own account and domain.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: pnpm/action-setup@v6.1.0
      - run: cd docs && pnpm install --frozen-lockfile && pnpm build
      - name: Deploy to Cloudflare Workers
        working-directory: docs
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
