name: Sync Mirrors

on:
  # Automatic mirroring is disabled until PanDB mirror repositories are provisioned.
  workflow_dispatch:

# Mirror providers reject concurrent forced updates to the same ref. Serialize tag,
# delete, and scheduled runs so overlapping triggers cannot race each other.
concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync-cnb:
    name: Sync to CNB
    # Mirror destinations are fixed to the upstream remotes; forks must never
    # publish their refs there, even with mirrored secrets (#10944).
    if: github.repository == 't8y2/dbx'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/dbxio.com/dbx.git"
          git push cnb --all --force
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push cnb ":refs/tags/${GITHUB_REF_NAME}" || true
          fi
          git push cnb --tags --force

  sync-atomgit:
    name: Sync to AtomGit
    if: github.repository == 't8y2/dbx'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Push to AtomGit
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -euo pipefail
          git remote add atomgit "https://t8y2:${ATOMGIT_TOKEN}@atomgit.com/t8y2/dbx.git"
          git push atomgit --all --force
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push atomgit ":refs/tags/${GITHUB_REF_NAME}" || true
          fi
          git push atomgit --tags --force

  sync-gitee:
    name: Sync to Gitee
    if: github.repository == 't8y2/dbx'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitee "https://codetty:${GITEE_TOKEN}@gitee.com/codetty/dbx.git"
          git push gitee --all --force
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push gitee ":refs/tags/${GITHUB_REF_NAME}" || true
          fi
          git push gitee --tags --force
