[package]
name = "dbx-plugin-cli"
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
description = "Scaffold and package DBX plugins"

[workspace]

[[bin]]
name = "dbx-plugin"
path = "src/main.rs"

[dependencies]
dbx-plugin-packager = { version = "0.1.0", path = "../packager" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8+spec-1.1.0"
[dev-dependencies]
tempfile = "3.27.0"